[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadshoot"
version = "0.1.0"
description = "Free, open-source local-business lead engine: whatever you sell, find the businesses missing it - gaps verified live on open data, ranked by opportunity."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "LeadShoot contributors" }]
keywords = ["leads", "openstreetmap", "local-business", "mcp", "agency"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
server = ["fastapi>=0.111", "uvicorn>=0.30"]
mcp = ["mcp>=1.2"]
overture = ["duckdb>=1.1"]
all = ["fastapi>=0.111", "uvicorn>=0.30", "mcp>=1.2", "duckdb>=1.1"]
dev = ["pytest>=8", "fastapi>=0.111", "uvicorn>=0.30", "mcp>=1.2"]

[project.scripts]
leadshoot = "leadshoot.cli:app"

[project.urls]
Homepage = "https://github.com/moasq/leadshoot"

[tool.hatch.build.targets.wheel]
packages = ["leadshoot"]
